<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Outer Shield -->
  <polygon points="50,5 90,27.5 90,72.5 50,95 10,72.5 10,27.5" fill="none" stroke="url(#logoGradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Inner Neural Network Nodes & Circuit Connections -->
  <path d="M50 20 L50 42 M50 58 L50 80 M25 35 L42 45 M58 55 L75 65 M75 35 L58 45 M42 55 L25 65" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  
  <!-- Neural Synapse Circles -->
  <circle cx="50" cy="20" r="5" fill="#06b6d4" filter="url(#neonGlow)" />
  <circle cx="25" cy="35" r="4.5" fill="#38bdf8" />
  <circle cx="75" cy="35" r="4.5" fill="#8b5cf6" />
  <circle cx="25" cy="65" r="4.5" fill="#ec4899" />
  <circle cx="75" cy="65" r="4.5" fill="#f43f5e" />
  <circle cx="50" cy="80" r="5" fill="#10b981" filter="url(#neonGlow)" />

  <!-- Central AI Core Sparkle Star -->
  <g transform="translate(50, 50)">
    <circle r="12" fill="url(#logoGradient)" opacity="0.3" filter="url(#neonGlow)" />
    <path d="M0 -10 Q0 0 10 0 Q0 0 0 10 Q0 0 -10 0 Q0 0 0 -10 Z" fill="#ffffff" filter="url(#neonGlow)" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Cosmic Amber Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1b06" />
      <stop offset="35%" stop-color="#1c1204" />
      <stop offset="75%" stop-color="#0f0b03" />
      <stop offset="100%" stop-color="#050301" />
    </linearGradient>

    <!-- Radial Glow Backdrop -->
    <radialGradient id="rocketGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#d97706" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Gold Metallic Hull Gradient -->
    <linearGradient id="rocketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Rocket Nose & Accent Gold Gradient -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Exhaust Flame Fire Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="rocketShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Squircle Frame -->
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="url(#bgGradient)" />
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="url(#rocketGlow)" />
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="none" stroke="rgba(245, 158, 11, 0.45)" stroke-width="3" />

  <!-- Code Interface Decorative Orbit Ring (Pinterest Animated Code Theme) -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2" stroke-dasharray="12 8 4 8" />
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(245, 158, 11, 0.15)" stroke-width="1.5" stroke-dasharray="24 16" />

  <!-- Sparkle Particle Accents -->
  <circle cx="120" cy="140" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="380" cy="130" r="5" fill="#f59e0b" opacity="0.85" />
  <circle cx="110" cy="340" r="3.5" fill="#fef08a" opacity="0.75" />
  <circle cx="390" cy="350" r="4" fill="#fbbf24" opacity="0.9" />

  <!-- Rocket Group with Drop Shadow -->
  <g filter="url(#rocketShadow)">
    
    <!-- Exhaust Flame Trail (Dynamic Rocket Blast Off) -->
    <g filter="url(#flameGlow)">
      <path d="M250 340 Q250 430 250 450 Q230 400 235 340 Z" fill="url(#flameGrad)" opacity="0.85" />
      <path d="M250 340 Q250 430 250 450 Q270 400 265 340 Z" fill="url(#flameGrad)" opacity="0.85" />
      <path d="M250 330 Q250 410 250 430 Q240 380 245 330 Z" fill="#ffffff" opacity="0.95" />
    </g>

    <!-- Left Wing Fin -->
    <path d="M190 280 L130 335 C125 340, 135 345, 145 342 L195 315 Z" fill="url(#accentGold)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Right Wing Fin -->
    <path d="M310 280 L370 335 C375 340, 365 345, 355 342 L305 315 Z" fill="url(#accentGold)" stroke="#ffffff" stroke-width="1.5" />

    <!-- Center Rocket Body Base -->
    <path d="M250 75 
             C300 135, 315 220, 310 325 
             L190 325 
             C185 220, 200 135, 250 75 Z" 
          fill="url(#rocketBodyGrad)" 
          stroke="#ffffff" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Rocket Nose Cap Highlight -->
    <path d="M250 75 C275 110, 285 145, 285 165 L215 165 C215 145, 225 110, 250 75 Z" fill="url(#accentGold)" />

    <!-- Circular Metallic Porthole Window -->
    <circle cx="250" cy="210" r="32" fill="#0f172a" stroke="#ffffff" stroke-width="3.5" />
    <circle cx="250" cy="210" r="24" fill="url(#accentGold)" opacity="0.9" />
    <circle cx="242" cy="202" r="8" fill="#ffffff" opacity="0.8" />

    <!-- Code Brackets Symbol Inside Window (< />) -->
    <path d="M242 205 L236 210 L242 215" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M258 205 L264 210 L258 215" fill="none" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="252" y1="204" x2="248" y2="216" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" />

    <!-- Bottom Exhaust Engine Nozzle -->
    <path d="M220 325 L215 340 L285 340 L280 325 Z" fill="#451a03" stroke="#f59e0b" stroke-width="2" />
  </g>
</svg>

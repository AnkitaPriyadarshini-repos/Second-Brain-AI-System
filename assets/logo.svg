<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Seamless Liquid Purple Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="40%" stop-color="#7e22ce" />
      <stop offset="80%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Chrome Metallic Base Gradient -->
    <linearGradient id="chromeBase" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#e0f2fe" />
      <stop offset="45%" stop-color="#7dd3fc" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Specular White Ridge Highlight -->
    <linearGradient id="specularHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#bae6fd" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Deep Metallic Reflection Gradient -->
    <linearGradient id="chromeReflection" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#a5f3fc" />
      <stop offset="60%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#091e42" />
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="starShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0052cc" flood-opacity="0.3" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Purple Container -->
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="url(#bgGradient)" />
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="url(#bgGlow)" />
  <rect x="25" y="25" width="450" height="450" rx="105" ry="105" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" />

  <!-- Ambient Light Reflection on Squircle -->
  <path d="M50 35 C180 28, 320 28, 450 35 C420 70, 80 70, 50 35 Z" fill="#ffffff" opacity="0.15" />

  <!-- Central Star Ambient Glow -->
  <g filter="url(#starGlow)">
    <circle cx="250" cy="245" r="140" fill="#bae6fd" opacity="0.3" />
  </g>

  <!-- 3D Liquid Chrome Metallic Star Geometry -->
  <g filter="url(#starShadow)">
    <!-- Outer Smooth Liquid Star Path -->
    <path d="M250 85 
             C266 185, 302 210, 412 218 
             C315 255, 290 300, 355 405 
             C265 338, 235 338, 145 405 
             C210 300, 185 255, 88 218 
             C198 210, 234 185, 250 85 Z" 
          fill="url(#chromeBase)" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Top Specular Ridge Highlight Facet -->
    <path d="M250 85 C256 170, 280 215, 412 218 C318 245, 272 265, 250 280 Z" 
          fill="url(#specularHighlight)" 
          opacity="0.9" />

    <!-- Left Metallic Shadow Facet -->
    <path d="M250 85 C244 170, 220 215, 88 218 C182 245, 228 265, 250 280 Z" 
          fill="url(#chromeReflection)" 
          opacity="0.8" />

    <!-- Lower Right Liquid Chrome Facet -->
    <path d="M250 280 C275 295, 310 330, 355 405 C295 355, 268 320, 250 280 Z" 
          fill="url(#chromeBase)" 
          opacity="0.95" />

    <!-- Lower Left Liquid Chrome Facet -->
    <path d="M250 280 C225 295, 190 330, 145 405 C205 355, 232 320, 250 280 Z" 
          fill="url(#specularHighlight)" 
          opacity="0.85" />

    <!-- Center Liquid Chrome Core Starburst -->
    <circle cx="250" cy="245" r="16" fill="#ffffff" filter="url(#starGlow)" opacity="0.95" />
    <path d="M250 210 Q250 245 285 245 Q250 245 250 280 Q250 245 215 245 Q250 245 250 210 Z" fill="#ffffff" />
  </g>
</svg>
